<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modul-Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
      body {
        font-family: 'Space Grotesk', sans-serif;
        background-color: #f6f5ee;
      }
      .neo-box {
        border: 3px solid #111;
        box-shadow: 4px 4px 0 #111;
        transition: all 0.15s ease-in-out;
      }
      .neo-box:hover {
        box-shadow: 6px 6px 0 #111;
      }
      .neo-btn {
        border: 3px solid #111;
        box-shadow: 4px 4px 0 #111;
        transition: all 0.1s ease;
      }
      .neo-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #111;
      }
      .emoji-pill {
        font-size: 2rem;
        border: 2px solid #111;
        box-shadow: 2px 2px 0 #111;
        transition: all 0.1s ease;
        user-select: none;
      }
      .emoji-pill.selected {
        background-color: #fef08a !important;
        transform: scale(1.08) translateY(-2px);
        box-shadow: 4px 4px 0 #111;
      }
    </style>
  </head>
  <body class="min-h-screen p-4 text-zinc-900 md:p-8">
    <div class="mx-auto max-w-6xl space-y-6">
      <header class="neo-box flex flex-wrap items-center justify-between gap-4 rounded-2xl bg-white p-6">
        <div>
          <h1 class="text-3xl font-black tracking-tight">🎓 Modul-Feedback</h1>
          <p class="mt-1 text-sm font-semibold text-zinc-600">Jahrgangs-Evaluation • Alle Module werden geteilt</p>
        </div>
        <div class="flex gap-2">
          <button onclick="openModal()" class="neo-btn rounded-xl bg-emerald-400 px-4 py-2 text-sm font-bold">
            + Modul hinzufügen
          </button>
          <button onclick="exportData()" class="neo-btn rounded-xl bg-zinc-100 px-4 py-2 text-sm font-bold">
            JSON-Export
          </button>
        </div>
      </header>

      <div class="grid grid-cols-1 gap-6 lg:grid-cols-12">
        <aside class="space-y-4 lg:col-span-5">
          <div class="neo-box rounded-2xl bg-white p-4">
            <input
              type="search"
              id="searchInput"
              oninput="renderModuleList()"
              placeholder="Modul suchen..."
              aria-label="Module suchen"
              class="neo-box w-full rounded-xl p-3 text-sm font-bold outline-none focus:bg-amber-50"
            >
          </div>
          <div id="moduleList" class="space-y-3" aria-live="polite"></div>
        </aside>

        <main id="feedbackPanel" class="space-y-6 lg:col-span-7" aria-live="polite">
          <div class="neo-box rounded-2xl bg-white p-12 text-center">
            <p class="text-lg font-bold text-zinc-500">Module werden geladen ...</p>
          </div>
        </main>
      </div>
    </div>

    <div id="moduleModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4 backdrop-blur-sm">
      <div class="neo-box w-full max-w-md space-y-4 rounded-2xl bg-white p-6">
        <h2 class="text-xl font-black">Neues Modul erfassen</h2>
        <div class="space-y-3">
          <div>
            <label for="newModuleName" class="mb-1 block text-xs font-bold uppercase">Modulname *</label>
            <input id="newModuleName" type="text" placeholder="z. B. Algorithmen & Datenstrukturen" class="neo-box w-full rounded-xl p-3 text-sm font-bold outline-none">
          </div>
          <div>
            <label for="newModuleCode" class="mb-1 block text-xs font-bold uppercase">Kürzel / Code</label>
            <input id="newModuleCode" type="text" placeholder="z. B. CS102" class="neo-box w-full rounded-xl p-3 text-sm font-bold outline-none">
          </div>
          <div>
            <label for="newModuleProf" class="mb-1 block text-xs font-bold uppercase">Dozent:in</label>
            <input id="newModuleProf" type="text" placeholder="z. B. Prof. Dr. Muster" class="neo-box w-full rounded-xl p-3 text-sm font-bold outline-none">
          </div>
        </div>
        <p id="moduleSaveError" class="hidden text-sm font-bold text-red-700" role="alert"></p>
        <div class="flex justify-end gap-2 pt-2">
          <button onclick="closeModal()" class="neo-btn rounded-xl bg-zinc-200 px-4 py-2 text-sm font-bold">Abbrechen</button>
          <button id="saveModuleButton" onclick="saveNewModule()" class="neo-btn rounded-xl bg-indigo-400 px-4 py-2 text-sm font-bold">Speichern</button>
        </div>
      </div>
    </div>

    <script>
      const EMOJIS = ['🔥', '💀', '🧠', '☕', '😴', '🏖️', '🤯', '🚀', '💩', '🤡', '🫠', '🎉', '📚', '⚡', '😭', '🧗', '🧘', '🍕', '🎯', '⚖️', '📉', '📈', '💣', '🦾'];
      const STORAGE_URL = '/api/data';
      const state = {
        modules: [],
        selectedModuleId: null,
        selectedRating: 3,
        selectedEmojis: [],
        comment: ''
      };

      function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, character => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[character]);
      }

      function showConfetti(options) {
        if (typeof confetti === 'function') confetti(options);
      }

      async function loadData() {
        const panel = document.getElementById('feedbackPanel');
        try {
          const response = await fetch(STORAGE_URL);
          if (!response.ok) throw new Error(`Laden fehlgeschlagen (HTTP ${response.status})`);
          const modules = await response.json();
          if (!Array.isArray(modules)) throw new Error('Die gespeicherten Moduldaten haben ein ungültiges Format.');

          state.modules = modules;
          if (state.modules.length > 0) state.selectedModuleId = state.modules[0].id;
          renderModuleList();
          renderFeedbackView();
        } catch (error) {
          console.error('Fehler beim Laden:', error);
          panel.innerHTML = `<div class="neo-box rounded-2xl bg-red-100 p-6 font-bold" role="alert">${escapeHTML(error.message || 'Daten konnten nicht geladen werden.')}</div>`;
          document.getElementById('moduleList').innerHTML = '';
        }
      }

      async function persistModules(modules) {
        const response = await fetch(STORAGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ modules })
        });
        if (!response.ok) {
          let message = `Speichern fehlgeschlagen (HTTP ${response.status})`;
          try {
            const result = await response.json();
            if (result.error) message = result.error;
          } catch {
            // Use the HTTP status when the server does not return JSON.
          }
          throw new Error(message);
        }
      }

      function renderModuleList() {
        const container = document.getElementById('moduleList');
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const filtered = state.modules.filter(module =>
          String(module.name || '').toLowerCase().includes(query) ||
          String(module.code || '').toLowerCase().includes(query)
        );

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="neo-box space-y-2 rounded-2xl bg-amber-200 p-6 text-center">
              <p class="font-bold">${state.modules.length ? 'Noch keine passenden Module vorhanden!' : 'Noch keine Module vorhanden!'}</p>
              <button onclick="openModal()" class="neo-btn rounded-xl bg-white px-3 py-1.5 text-xs font-bold">+ Jetzt anlegen</button>
            </div>`;
          return;
        }

        container.innerHTML = filtered.map(module => {
          const active = module.id === state.selectedModuleId ? 'bg-amber-300' : 'bg-white';
          const reviews = Array.isArray(module.reviews) ? module.reviews : [];
          const ratings = reviews.map(review => Number(review.rating)).filter(rating => Number.isFinite(rating));
          const average = ratings.length ? (ratings.reduce((sum, rating) => sum + rating, 0) / ratings.length).toFixed(1) : '-';
          return `
            <div data-module-id="${escapeHTML(module.id)}" class="neo-box ${active} cursor-pointer rounded-xl p-4">
              <div class="flex items-start justify-between">
                <div>
                  <span class="text-xs font-black uppercase text-zinc-500">${escapeHTML(module.code || 'MODUL')}</span>
                  <h3 class="text-base font-bold leading-tight">${escapeHTML(module.name || '')}</h3>
                  ${module.prof ? `<p class="mt-1 text-xs text-zinc-600">${escapeHTML(module.prof)}</p>` : ''}
                </div>
                <div class="text-right">
                  <span class="neo-box rounded-lg bg-white px-2 py-0.5 text-xs font-black">★ ${average}</span>
                  <p class="mt-1 text-[10px] font-bold text-zinc-500">${reviews.length} Reviews</p>
                </div>
              </div>
            </div>`;
        }).join('');

        container.querySelectorAll('[data-module-id]').forEach(element => {
          element.addEventListener('click', () => selectModule(element.dataset.moduleId));
        });
      }

      function selectModule(id) {
        state.selectedModuleId = id;
        state.selectedRating = 3;
        state.selectedEmojis = [];
        state.comment = '';
        renderModuleList();
        renderFeedbackView();
      }

      function renderFeedbackView() {
        const container = document.getElementById('feedbackPanel');
        const module = state.modules.find(item => item.id === state.selectedModuleId);

        if (!module) {
          container.innerHTML = `<div class="neo-box rounded-2xl bg-white p-12 text-center font-bold text-zinc-500">Kein Modul ausgewählt</div>`;
          return;
        }

        const reviews = Array.isArray(module.reviews) ? module.reviews : [];
        container.innerHTML = `
          <div class="neo-box space-y-5 rounded-2xl bg-white p-6">
            <div class="border-b-2 border-zinc-900 pb-3">
              <span class="text-xs font-black uppercase text-indigo-600">${escapeHTML(module.code || 'MODUL')}</span>
              <h2 class="text-2xl font-black">${escapeHTML(module.name || '')}</h2>
            </div>
            <div>
              <label class="mb-2 block text-xs font-black uppercase tracking-wider">Gesamtnote (1 bis 5)</label>
              <div class="grid grid-cols-5 gap-2">
                ${[1, 2, 3, 4, 5].map(value => `
                  <button type="button" onclick="setRating(${value})" aria-pressed="${state.selectedRating === value}" class="neo-btn rounded-xl py-3 text-lg font-black ${state.selectedRating === value ? 'bg-indigo-400 text-white' : 'bg-zinc-100'}">${value}</button>
                `).join('')}
              </div>
            </div>
            <div>
              <label class="mb-2 block text-xs font-black uppercase tracking-wider">Vibes / Eindrücke</label>
              <div class="grid grid-cols-6 gap-2 rounded-xl border-2 border-zinc-900 bg-zinc-50 p-3 sm:grid-cols-8">
                ${EMOJIS.map(emoji => `
                  <button type="button" onclick="toggleEmoji('${emoji}')" aria-label="Emoji ${emoji}" aria-pressed="${state.selectedEmojis.includes(emoji)}" class="emoji-pill flex cursor-pointer items-center justify-center rounded-xl p-2 ${state.selectedEmojis.includes(emoji) ? 'selected' : 'bg-white'}">${emoji}</button>
                `).join('')}
              </div>
            </div>
            <div>
              <label for="commentInput" class="mb-1 block text-xs font-black uppercase tracking-wider">Dein Kommentar / Klausur-Tipp</label>
              <textarea id="commentInput" rows="3" placeholder="Wie war der Aufwand? Was sollte man wissen?" class="neo-box w-full rounded-xl p-3 text-sm font-medium outline-none">${escapeHTML(state.comment)}</textarea>
            </div>
            <p id="reviewError" class="hidden text-sm font-bold text-red-700" role="alert"></p>
            <button id="submitReviewButton" onclick="submitReview()" class="neo-btn w-full rounded-xl bg-lime-300 py-3 text-base font-black">Feedback eintragen 🚀</button>
          </div>
          <div class="space-y-3">
            <h3 class="text-lg font-black">Bisherige Rückmeldungen (${reviews.length})</h3>
            ${reviews.length === 0 ? '<p class="text-sm font-bold text-zinc-500">Noch keine Einträge. Sei die/der Erste!</p>' : ''}
            ${reviews.map(review => {
              const date = new Date(review.timestamp);
              const dateText = Number.isNaN(date.getTime()) ? '' : date.toLocaleDateString('de-DE');
              const emojis = Array.isArray(review.emojis) ? review.emojis : [];
              return `
                <div class="neo-box space-y-2 rounded-xl bg-white p-4">
                  <div class="flex items-center justify-between">
                    <span class="neo-box rounded bg-indigo-100 px-2 py-0.5 text-xs font-bold">Bewertung: ${escapeHTML(review.rating)} / 5</span>
                    <span class="text-[11px] font-bold text-zinc-400">${escapeHTML(dateText)}</span>
                  </div>
                  ${emojis.length ? `<div class="flex flex-wrap gap-1 text-xl">${emojis.map(escapeHTML).join(' ')}</div>` : ''}
                  ${review.comment ? `<p class="rounded-lg border border-zinc-200 bg-zinc-50 p-2.5 text-sm font-medium text-zinc-800">${escapeHTML(review.comment)}</p>` : ''}
                </div>`;
            }).join('')}
          </div>`;

        document.getElementById('commentInput').addEventListener('input', event => {
          state.comment = event.target.value;
        });
      }

      function setRating(value) {
        state.selectedRating = value;
        renderFeedbackView();
      }

      function toggleEmoji(emoji) {
        state.selectedEmojis = state.selectedEmojis.includes(emoji)
          ? state.selectedEmojis.filter(item => item !== emoji)
          : [...state.selectedEmojis, emoji];
        renderFeedbackView();
      }

      async function submitReview() {
        const module = state.modules.find(item => item.id === state.selectedModuleId);
        if (!module) return;

        const review = {
          rating: state.selectedRating,
          emojis: [...state.selectedEmojis],
          comment: state.comment.trim(),
          timestamp: new Date().toISOString()
        };
        const modules = state.modules.map(item => item.id === module.id
          ? { ...item, reviews: [review, ...(Array.isArray(item.reviews) ? item.reviews : [])] }
          : item
        );
        const button = document.getElementById('submitReviewButton');
        button.disabled = true;
        try {
          await persistModules(modules);
          state.modules = modules;
          state.selectedEmojis = [];
          state.selectedRating = 3;
          state.comment = '';
          showConfetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
          renderModuleList();
          renderFeedbackView();
        } catch (error) {
          console.error('Fehler beim Speichern:', error);
          const errorElement = document.getElementById('reviewError');
          errorElement.textContent = error.message || 'Konnte nicht gespeichert werden. Prüfe die Verbindung.';
          errorElement.classList.remove('hidden');
          button.disabled = false;
        }
      }

      function openModal() {
        document.getElementById('moduleSaveError').classList.add('hidden');
        document.getElementById('moduleModal').classList.remove('hidden');
        document.getElementById('moduleModal').classList.add('flex');
      }

      function closeModal() {
        const modal = document.getElementById('moduleModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        document.getElementById('newModuleName').value = '';
        document.getElementById('newModuleCode').value = '';
        document.getElementById('newModuleProf').value = '';
      }

      async function saveNewModule() {
        const name = document.getElementById('newModuleName').value.trim();
        const code = document.getElementById('newModuleCode').value.trim();
        const prof = document.getElementById('newModuleProf').value.trim();
        const errorElement = document.getElementById('moduleSaveError');
        if (!name) {
          errorElement.textContent = 'Bitte einen Modulnamen angeben!';
          errorElement.classList.remove('hidden');
          return;
        }

        const newModule = {
          id: `mod_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          name,
          code,
          prof,
          reviews: []
        };
        const modules = [...state.modules, newModule];
        const button = document.getElementById('saveModuleButton');
        button.disabled = true;
        errorElement.classList.add('hidden');
        try {
          await persistModules(modules);
          state.modules = modules;
          state.selectedModuleId = newModule.id;
          state.selectedRating = 3;
          state.selectedEmojis = [];
          state.comment = '';
          closeModal();
          showConfetti({ particleCount: 40, spread: 50 });
          renderModuleList();
          renderFeedbackView();
        } catch (error) {
          console.error('Fehler beim Speichern:', error);
          errorElement.textContent = error.message || 'Konnte nicht gespeichert werden. Prüfe die Verbindung.';
          errorElement.classList.remove('hidden');
        } finally {
          button.disabled = false;
        }
      }

      function exportData() {
        const blob = new Blob([JSON.stringify(state.modules, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `modul-feedback-export-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        URL.revokeObjectURL(url);
      }

      loadData();
    </script>
  </body>
</html>
